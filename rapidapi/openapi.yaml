openapi: 3.0.3
info:
  title: WhisperServe Audio Transcription API
  description: FastAPI-based audio transcription service powered by OpenAI Whisper. Upload audio files and receive text transcriptions via a REST API.
  version: 1.0.0
  contact:
    name: WhisperServe API Support
    email: support@whisperserve.example.com
  license:
    name: MIT
  termsOfService: https://whisperserve.com/terms
